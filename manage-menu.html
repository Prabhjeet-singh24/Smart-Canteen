<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage menu · Smart Canteen</title>
<link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin" data-page="admin-menu" data-root="../">
<div id="admin-sidebar"></div>
<div class="admin-wrap">
  <header id="admin-topbar"></header>
  <main class="admin-content">
    <div class="toolbar">
      <div class="grow"><label class="sr-only" for="menu-search">Search items</label><input class="input" id="menu-search" type="search" placeholder="Search menu items…"></div>
      <select class="input" id="menu-cat-filter" aria-label="Filter by category"></select>
      <button class="btn btn-outline" id="manage-cats">🗂️ Categories</button>
      <button class="btn btn-primary" id="add-item">＋ Add item</button>
    </div>
    <section class="card" id="menu-table"></section>
  </main>
</div>
<div id="toast-root"></div>
<script src="../js/config.js"></script>
<script src="../js/main.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
