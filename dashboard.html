<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin dashboard · Smart Canteen</title>
<link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin" data-page="admin-dashboard" data-root="../">
<div id="admin-sidebar"></div>
<div class="admin-wrap">
  <header id="admin-topbar"></header>
  <main class="admin-content">
    <p class="muted" id="today-line" style="margin-top:0">&nbsp;</p>
    <div class="kpi-grid" id="kpis"></div>
    <div class="two-col">
      <section class="card panel"><h3>Recent orders <a class="btn btn-outline btn-sm" href="manage-orders.html">Manage orders</a></h3><div id="recent-orders">Loading…</div></section>
      <div class="stack">
        <section class="card panel"><h3>Order status</h3><div class="status-bars" id="status-bars"></div></section>
        <section class="card panel"><h3>Top sellers</h3><div id="popular"></div></section>
      </div>
    </div>
  </main>
</div>
<div id="toast-root"></div>
<script src="../js/config.js"></script>
<script src="../js/main.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
